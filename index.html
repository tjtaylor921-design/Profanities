<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grawlix Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff6d6;
    --dots: #f3c94a;
    --ink: #161616;
    --bubble: #ffffff;
    --pow: #e8352b;
    --zap: #1f6fd1;
    --muted: #5b5444;
    --meter-bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b1830; --dots: #2d2850; --ink: #f4efe1; --bubble: #262243;
      --pow: #ff5a4e; --zap: #5aa2ff; --muted: #b9b2d6; --meter-bg: #14122a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1b1830; --dots: #2d2850; --ink: #f4efe1; --bubble: #262243;
    --pow: #ff5a4e; --zap: #5aa2ff; --muted: #b9b2d6; --meter-bg: #14122a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(var(--dots) 22%, transparent 24%);
    background-size: 14px 14px;
    font-family: "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }

  h1 {
    font-family: Bangers, Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(48px, 12vw, 92px);
    letter-spacing: 2px;
    line-height: .95;
    margin: 0 0 8px;
    color: var(--pow);
    -webkit-text-stroke: 2px var(--ink);
    text-shadow: 5px 5px 0 var(--ink);
    transform: rotate(-2deg);
  }
  .tag { margin: 0 0 28px; font-size: 18px; color: var(--muted); font-weight: 700; }

  .panel {
    background: var(--bubble);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    padding: 18px;
    margin-bottom: 36px;
  }
  label { display: block; font-family: Bangers, Impact, sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    font: 700 18px/1.4 "Comic Neue", system-ui, sans-serif;
    color: var(--ink);
    background: transparent;
    border: 3px dashed var(--muted);
    padding: 10px 12px;
    outline: none;
  }
  textarea:focus { border-color: var(--zap); border-style: solid; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  button {
    font-family: Bangers, Impact, sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--dots);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 6px 14px;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  button:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button.primary { background: var(--pow); color: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; margin-left: auto; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--pow); }

  /* Speech bubble */
  .stage { position: relative; padding-bottom: 8px; }
  .bubble {
    position: relative;
    background: var(--bubble);
    border: 4px solid var(--ink);
    border-radius: 48% 52% 46% 54% / 58% 50% 50% 42%;
    padding: 46px 40px;
    min-height: 170px;
    display: grid;
    place-items: center;
    text-align: center;
    font: 700 clamp(22px, 5vw, 32px)/1.35 "Comic Neue", system-ui, sans-serif;
    box-shadow: 8px 8px 0 var(--ink);
    overflow-wrap: anywhere;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -46px; left: 28%;
    width: 46px; height: 50px;
    background: var(--bubble);
    border-right: 4px solid var(--ink);
    border-bottom: 4px solid var(--ink);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    transform: skewX(-25deg);
  }
  .bubble.empty { color: var(--muted); font-style: italic; font-weight: 400; }
  .bubble.fury { animation: quake .25s infinite; }

  .g {
    display: inline-block;
    color: var(--pow);
    font-family: Bangers, Impact, sans-serif;
    letter-spacing: 1px;
    cursor: help;
    position: relative;
  }
  .g span { display: inline-block; animation: jitter .6s infinite; }
  .g span:nth-child(3n)   { color: var(--zap); animation-delay: -.2s; }
  .g span:nth-child(3n+1) { animation-delay: -.4s; }
  .g[data-word]:hover::after, .g[data-word]:focus::after {
    content: attr(data-word);
    position: absolute;
    left: 50%; bottom: 110%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font: 700 14px "Comic Neue", sans-serif;
    padding: 3px 8px;
    white-space: nowrap;
    z-index: 2;
  }
  .g:focus { outline: 2px dotted var(--zap); outline-offset: 2px; }

  @keyframes jitter {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(-1px, -2px) rotate(-6deg); }
    50% { transform: translate(1px, 1px) rotate(4deg); }
    75% { transform: translate(-1px, 2px) rotate(-3deg); }
  }
  @keyframes quake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(-3px, 2px) rotate(-.6deg); }
    50% { transform: translate(3px, -2px) rotate(.6deg); }
    75% { transform: translate(-2px, -3px) rotate(-.3deg); }
  }


  /* The speaker: a painted 1950s pinup whose face follows the rage meter */
  .speaker {
    display: block;
    width: min(320px, 80vw);
    height: auto;
    margin: 4px 0 0 max(0px, calc(28% - 160px));
    overflow: visible;
  }
  .speaker .brow { fill: #5e2410; transition: transform .25s; }
  .speaker .brow-l { transform-origin: 120px 110px; }
  .speaker .brow-r { transform-origin: 200px 110px; }
  .speaker .flush { fill: #e04848; opacity: 0; transition: opacity .3s; }
  .speaker .mouth, .speaker .steam, .speaker .vein { display: none; }
  .speaker[data-mood="calm"] .m-smile,
  .speaker[data-mood="miffed"] .m-purse,
  .speaker[data-mood="angry"] .m-shout,
  .speaker[data-mood="nuclear"] .m-shout { display: inline; }
  .speaker[data-mood="miffed"] .brow-l { transform: rotate(6deg); }
  .speaker[data-mood="miffed"] .brow-r { transform: rotate(-6deg); }
  .speaker[data-mood="miffed"] .flush { opacity: .12; }
  .speaker[data-mood="angry"] .brow-l, .speaker[data-mood="nuclear"] .brow-l { transform: rotate(18deg); }
  .speaker[data-mood="angry"] .brow-r, .speaker[data-mood="nuclear"] .brow-r { transform: rotate(-18deg); }
  .speaker[data-mood="angry"] .flush { opacity: .3; }
  .speaker[data-mood="angry"] .vein, .speaker[data-mood="nuclear"] .vein { display: inline; }
  .speaker[data-mood="nuclear"] .flush { opacity: .5; }
  .speaker .arm-up { transform-origin: 238px 256px; animation: wave 2.4s ease-in-out infinite; }
  .speaker[data-mood="angry"] .arm-up, .speaker[data-mood="nuclear"] .arm-up { animation: shake .22s linear infinite; }
  .speaker[data-mood="nuclear"] .steam { display: inline; animation: puff 1s ease-out infinite; }
  .speaker[data-mood="nuclear"] .steam-r { animation-delay: -.5s; }
  .speaker[data-mood="nuclear"] .head { animation: quake .3s infinite; transform-origin: 160px 200px; }
  .speaker .steam { transform-box: fill-box; transform-origin: center; }
  @keyframes wave { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(6deg); } }
  @keyframes shake { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes puff {
    0% { transform: translateY(8px) scale(.6); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(-22px) scale(1.15); opacity: 0; }
  }

  /* Rage meter */
  .meter { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .meter-label { font-family: Bangers, Impact, sans-serif; font-size: 22px; letter-spacing: 1px; min-width: 120px; }
  .bar { flex: 1; height: 26px; border: 3px solid var(--ink); background: var(--meter-bg); position: relative; overflow: hidden; }
  .fill {
    height: 100%;
    width: 0;
    background: repeating-linear-gradient(-45deg, var(--pow) 0 12px, #ff8a3d 12px 24px);
    transition: width .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .verdict { font-family: Bangers, Impact, sans-serif; font-size: 22px; min-width: 132px; text-align: right; color: var(--pow); }

  /* Pow burst */
  .burst {
    position: absolute;
    right: 4px; top: -26px;
    font-family: Bangers, Impact, sans-serif;
    font-size: 34px;
    color: #fff;
    background: var(--pow);
    padding: 26px 22px;
    clip-path: polygon(50% 0, 61% 30%, 98% 18%, 72% 46%, 100% 70%, 64% 68%, 56% 100%, 44% 70%, 6% 88%, 30% 58%, 0 30%, 38% 32%);
    transform: rotate(12deg) scale(0);
    transition: transform .25s cubic-bezier(.3, 1.8, .5, 1);
    pointer-events: none;
    -webkit-text-stroke: 1px var(--ink);
  }
  .burst.show { transform: rotate(12deg) scale(1); }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .presets button { font-size: 16px; padding: 4px 10px; box-shadow: 3px 3px 0 var(--ink); background: var(--bubble); }

  footer { margin-top: 40px; color: var(--muted); font-size: 15px; }
  code { font-family: ui-monospace, monospace; background: var(--bubble); border: 2px solid var(--ink); padding: 0 5px; }

  @media (max-width: 520px) {
    .toggle { margin-left: 0; }
    .meter { flex-wrap: wrap; }
    .meter-label, .verdict { min-width: 0; }
    .bubble { padding: 36px 22px; }
    .burst { font-size: 24px; padding: 18px 16px; right: 0; }
    .speaker { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .g span, .bubble.fury, .speaker .steam, .speaker .head, .speaker .arm-up { animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Grawlix Machine</h1>
  <p class="tag">Type something rude and get it back as cartoon swearing. Hover a symbol to see the word underneath.</p>

  <section class="panel">
    <label for="input">Say it. Go on.</label>
    <textarea id="input" spellcheck="false" placeholder="e.g. the damn printer jammed again"></textarea>
    <div class="controls">
      <button class="primary" id="reroll" type="button">Re-roll!</button>
      <button id="copy" type="button">Copy</button>
      <label class="toggle"><input type="checkbox" id="everything"> Censor everything</label>
    </div>
    <div class="presets" aria-label="Example rants">
      <button type="button">The damn wifi is down AGAIN!!</button>
      <button type="button">who left this shit in the fridge</button>
      <button type="button">STUBBED MY TOE ON THE BLOODY BED FRAME, FUCK!</button>
      <button type="button">Have a lovely day :)</button>
    </div>
  </section>

  <section class="stage" aria-live="polite">
    <div class="burst" id="burst">POW!</div>
    <div class="bubble empty" id="bubble">…</div>
    <svg class="speaker" id="speaker" data-mood="calm" viewBox="0 0 320 400" role="img" aria-label="A curvy 1950s pinup woman with curly auburn hair, pearls and a teal polka-dot dress, saying the words in the bubble">
      <defs>
        <radialGradient id="skin" cx=".42" cy=".36" r=".75"><stop offset="0" stop-color="#ffe3cf"/><stop offset=".6" stop-color="#f4bd99"/><stop offset="1" stop-color="#d98f6c"/></radialGradient>
        <radialGradient id="skin2" cx=".5" cy=".3" r=".9"><stop offset="0" stop-color="#fbd6bb"/><stop offset=".7" stop-color="#f0b48f"/><stop offset="1" stop-color="#d48a68"/></radialGradient>
        <radialGradient id="hair" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ec8f55"/><stop offset=".5" stop-color="#b4471c"/><stop offset="1" stop-color="#6a230f"/></radialGradient>
        <linearGradient id="hairBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c3d18"/><stop offset="1" stop-color="#561b0a"/></linearGradient>
        <radialGradient id="dress" cx=".4" cy=".15" r="1"><stop offset="0" stop-color="#62cbbc"/><stop offset=".5" stop-color="#23968a"/><stop offset="1" stop-color="#125850"/></radialGradient>
        <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d93a4f"/><stop offset="1" stop-color="#9e1c30"/></linearGradient>
        <radialGradient id="iris" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#a6cf86"/><stop offset=".55" stop-color="#4c8b4a"/><stop offset="1" stop-color="#1f4026"/></radialGradient>
        <radialGradient id="pearl" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#efe8dc"/><stop offset="1" stop-color="#a99f92"/></radialGradient>
        <linearGradient id="bow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc0b1"/><stop offset="1" stop-color="#14625a"/></linearGradient>
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.8" fill="#fffaf0" opacity=".7"/><circle cx="15" cy="15" r="2.8" fill="#fffaf0" opacity=".7"/></pattern>
        <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
        <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
        <filter id="paint" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
        <linearGradient id="fadeG" x1="0" y1="0" x2="0" y2="1"><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
        <mask id="fade" maskUnits="userSpaceOnUse" x="-40" y="-40" width="400" height="480"><rect x="-40" y="-40" width="400" height="440" fill="url(#fadeG)"/></mask>
        <clipPath id="cFace"><path d="M160 62 C196 62 214 92 214 126 C214 160 192 190 160 192 C128 190 106 160 106 126 C106 92 124 62 160 62 Z"/></clipPath>
        <clipPath id="cNeck"><path d="M138 176 C140 198 138 212 130 226 L190 226 C182 212 180 198 182 176 Z"/></clipPath>
        <clipPath id="cChest"><path d="M58 300 C60 254 92 230 132 222 L188 222 C226 230 252 250 256 282 L256 300 L60 300 Z"/></clipPath>
        <clipPath id="cDress"><path d="M64 400 L64 292 C64 272 84 258 112 258 C136 258 152 270 160 282 C168 270 184 258 208 258 C236 258 256 272 256 292 L256 400 Z"/></clipPath>
        <clipPath id="cLarm"><path d="M70 260 C52 280 44 320 46 360 C47 380 50 394 52 400 L86 400 C82 380 80 350 84 322 C86 300 88 280 84 266 Z"/></clipPath>
        <clipPath id="cArm"><path d="M232 244 C252 234 274 220 290 214 C304 210 314 224 306 238 C294 250 268 264 248 278 Z M290 216 C302 192 298 162 288 142 L262 150 C270 168 276 190 276 212 Z M258 152 C250 138 252 118 266 112 C280 106 294 116 293 132 C293 146 287 154 274 156 Z"/></clipPath>
        <g id="curl">
          <path fill="url(#hair)" d="M0 -20 C16 -20 24 -6 20 8 C16 20 0 24 -12 18 C-24 10 -22 -12 -10 -18 Z"/>
          <path fill="none" stroke="#5a1c0a" stroke-width="2" stroke-linecap="round" opacity=".55" d="M-14 12 C-20 0 -14 -14 0 -16"/>
          <path fill="none" stroke="#f6a46c" stroke-width="1.5" stroke-linecap="round" opacity=".5" d="M-4 -9 C6 -13 13 -3 7 6"/>
          <path fill="none" stroke="#f6a46c" stroke-width="1" stroke-linecap="round" opacity=".45" d="M-16 4 C-14 -8 -6 -14 4 -15 M-8 14 C2 16 14 10 17 0"/>
          <path fill="none" stroke="#ffc597" stroke-width="1" stroke-linecap="round" opacity=".6" d="M2 -15 C10 -13 16 -6 15 2"/>
        </g>
      </defs>

      <g filter="url(#paint)" mask="url(#fade)">
        <!-- hair behind the head -->
        <g class="head"><path fill="url(#hairBack)" d="M96 130 C84 80 110 30 160 28 C210 30 236 80 224 130 C234 160 232 198 214 218 C204 202 208 182 206 166 L114 166 C112 182 116 202 106 218 C88 198 86 160 96 130 Z"/></g>

        <!-- neck -->
        <path fill="url(#skin2)" d="M138 176 C140 198 138 212 130 226 L190 226 C182 212 180 198 182 176 Z"/>
        <g clip-path="url(#cNeck)"><ellipse fill="#9c5638" opacity=".65" filter="url(#blur8)" cx="160" cy="186" rx="34" ry="16"/><ellipse fill="#c27556" opacity=".4" filter="url(#blur4)" cx="184" cy="205" rx="8" ry="26"/></g>

        <!-- shoulders and chest -->
        <path fill="url(#skin2)" d="M58 300 C60 254 92 230 132 222 L188 222 C226 230 252 250 256 282 L256 300 L60 300 Z"/>
        <g clip-path="url(#cChest)">
          <ellipse fill="#fff0e2" opacity=".55" filter="url(#blur8)" cx="96" cy="250" rx="22" ry="10"/>
          <ellipse fill="#fff0e2" opacity=".55" filter="url(#blur8)" cx="224" cy="250" rx="22" ry="10"/>
          <ellipse fill="#b86c4c" opacity=".35" filter="url(#blur8)" cx="160" cy="226" rx="30" ry="8"/>
          <path fill="none" stroke="#c07655" stroke-width="2" stroke-linecap="round" opacity=".45" filter="url(#blur2)" d="M126 234 C138 238 148 238 155 236 M194 234 C182 238 172 238 165 236"/>
          <ellipse fill="#b86c4c" opacity=".45" filter="url(#blur4)" cx="160" cy="276" rx="5" ry="10"/>
        </g>
        <g><circle fill="url(#pearl)" cx="128.0" cy="234.0" r="3.6"/><circle fill="url(#pearl)" cx="132.0" cy="237.8" r="3.6"/><circle fill="url(#pearl)" cx="136.0" cy="241.0" r="3.6"/><circle fill="url(#pearl)" cx="140.0" cy="243.8" r="3.6"/><circle fill="url(#pearl)" cx="144.0" cy="246.0" r="3.6"/><circle fill="url(#pearl)" cx="148.0" cy="247.8" r="3.6"/><circle fill="url(#pearl)" cx="152.0" cy="249.0" r="3.6"/><circle fill="url(#pearl)" cx="156.0" cy="249.8" r="3.6"/><circle fill="url(#pearl)" cx="160.0" cy="250.0" r="3.6"/><circle fill="url(#pearl)" cx="164.0" cy="249.8" r="3.6"/><circle fill="url(#pearl)" cx="168.0" cy="249.0" r="3.6"/><circle fill="url(#pearl)" cx="172.0" cy="247.8" r="3.6"/><circle fill="url(#pearl)" cx="176.0" cy="246.0" r="3.6"/><circle fill="url(#pearl)" cx="180.0" cy="243.8" r="3.6"/><circle fill="url(#pearl)" cx="184.0" cy="241.0" r="3.6"/><circle fill="url(#pearl)" cx="188.0" cy="237.8" r="3.6"/><circle fill="url(#pearl)" cx="192.0" cy="234.0" r="3.6"/></g>

        <!-- dress -->
        <path fill="url(#dress)" d="M64 400 L64 292 C64 272 84 258 112 258 C136 258 152 270 160 282 C168 270 184 258 208 258 C236 258 256 272 256 292 L256 400 Z"/>
        <path fill="url(#dots)" d="M64 400 L64 292 C64 272 84 258 112 258 C136 258 152 270 160 282 C168 270 184 258 208 258 C236 258 256 272 256 292 L256 400 Z"/>
        <g clip-path="url(#cDress)">
          <ellipse fill="#bff0e7" opacity=".45" filter="url(#blur8)" cx="112" cy="282" rx="26" ry="14"/>
          <ellipse fill="#bff0e7" opacity=".45" filter="url(#blur8)" cx="208" cy="282" rx="26" ry="14"/>
          <path fill="#0b3d37" opacity=".5" filter="url(#blur8)" d="M70 330 C100 346 130 344 158 334 C190 344 220 346 250 330 L250 350 L70 350 Z"/>
          <ellipse fill="#0b3d37" opacity=".45" filter="url(#blur8)" cx="160" cy="300" rx="10" ry="22"/>
          <path fill="none" stroke="#0b3d37" stroke-width="3" opacity=".35" filter="url(#blur2)" d="M110 372 C114 384 116 394 116 400 M160 374 L160 400 M210 372 C206 384 204 394 204 400"/>
        </g>
        <path fill="none" stroke="#1d7b70" stroke-width="7" stroke-linecap="round" d="M104 262 C106 250 110 240 116 230 M216 262 C214 250 210 240 204 230"/>
        <path fill="#c8282f" d="M64 360 C120 368 200 368 256 360 L256 374 C200 382 120 382 64 374 Z"/>
        <path fill="none" stroke="#ff9a9a" stroke-width="1.4" opacity=".6" d="M64 363 C120 371 200 371 256 363"/>
        <rect fill="none" stroke="#e8c27a" stroke-width="2.5" x="151" y="363" width="18" height="13" rx="2.5"/>

        <!-- arm at her side -->
        <path fill="url(#skin2)" d="M70 260 C52 280 44 320 46 360 C47 380 50 394 52 400 L86 400 C82 380 80 350 84 322 C86 300 88 280 84 266 Z"/>
        <g clip-path="url(#cLarm)"><ellipse fill="#a85f40" opacity=".55" filter="url(#blur8)" cx="88" cy="330" rx="10" ry="70"/><ellipse fill="#fff0e2" opacity=".45" filter="url(#blur8)" cx="56" cy="300" rx="6" ry="40"/></g>

        <!-- raised arm: waves when calm, shakes a fist when angry -->
        <g class="arm-up">
          <path fill="url(#skin2)" d="M232 244 C252 234 274 220 290 214 C304 210 314 224 306 238 C294 250 268 264 248 278 Z"/>
          <path fill="url(#skin2)" d="M290 216 C302 192 298 162 288 142 L262 150 C270 168 276 190 276 212 Z"/>
          <path fill="url(#skin)" d="M258 152 C250 138 252 118 266 112 C280 106 294 116 293 132 C293 146 287 154 274 156 Z"/>
          <g clip-path="url(#cArm)">
            <path fill="#a85f40" opacity=".5" filter="url(#blur8)" d="M246 280 C270 266 292 252 306 240 L310 250 L250 290 Z"/>
            <ellipse fill="#a85f40" opacity=".45" filter="url(#blur4)" cx="266" cy="190" rx="6" ry="40"/>
            <ellipse fill="#fff0e2" opacity=".5" filter="url(#blur4)" cx="292" cy="180" rx="5" ry="30"/>
            <ellipse fill="#fff0e2" opacity=".5" filter="url(#blur4)" cx="276" cy="122" rx="10" ry="6"/>
          </g>

  <footer>
    Underneath it all is <code>grawlix.js</code>, a profanity filter with no dependencies.
    It runs in the browser and in Node: <code>censor("oh shit")</code> → <code>"oh @#☠%"</code>.

<script type="module">
  import { tokenize, grawlix, rage } from './grawlix.js';

  const $ = (id) => document.getElementById(id);
  const input = $('input'), bubble = $('bubble'), everything = $('everything');
  const speaker = $('speaker'), fill = $('fill'), bar = $('bar'), verdict = $('verdict'), burst = $('burst');

  const VERDICTS = [
    [0, 'Zen'], [1, 'Mildly miffed'], [25, 'Grumpy'], [45, 'Steaming'],
    [65, 'Livid'], [85, 'NUCLEAR'],
  ];

  let parts = [];

  function render() {
    bubble.replaceChildren();
    bubble.className = 'bubble';
    const text = input.value.trim();
    if (!text) {
      bubble.className = 'bubble empty';
      bubble.textContent = '…';
    } else {
      const line = document.createElement('p');
      line.style.margin = '0';
      bubble.append(line);
      for (const p of parts) {
        if (!p.profane) { line.append(p.text); continue; }
        const g = document.createElement('span');
        g.className = 'g';
        g.tabIndex = 0;
        g.dataset.word = p.text;
        g.setAttribute('aria-label', 'censored');
        for (const ch of p.replacement) {
          const s = document.createElement('span');
          s.textContent = ch;
          g.append(s);
        }
        line.append(g);
      }
    }
    const score = everything.checked && text ? 100 : rage(text);
    fill.style.width = score + '%';
    bar.setAttribute('aria-valuenow', score);
    verdict.textContent = VERDICTS.filter(([min]) => score >= min).pop()[1];
    bubble.classList.toggle('fury', score >= 85);
    speaker.dataset.mood = score >= 85 ? 'nuclear' : score >= 45 ? 'angry' : score >= 15 ? 'miffed' : 'calm';
    burst.classList.toggle('show', parts.some((p) => p.profane));
  }

  function update() {
    parts = tokenize(input.value.trim(), { everything: everything.checked });
    render();
  }

  // Swap fresh symbols in place, keeping the same words.
  function reroll() {
    parts = parts.map((p) => p.profane ? { ...p, replacement: grawlix(p.text.length) } : p);
    render();
  }

  input.addEventListener('input', update);
  everything.addEventListener('change', update);
  $('reroll').addEventListener('click', reroll);
  $('copy').addEventListener('click', async (e) => {
    const out = parts.map((p) => p.replacement ?? p.text).join('');
    try { await navigator.clipboard.writeText(out); e.target.textContent = 'Copied!'; }
    catch { e.target.textContent = 'Nope'; }
    setTimeout(() => (e.target.textContent = 'Copy'), 1200);
  });
  document.querySelectorAll('.presets button').forEach((b) =>
    b.addEventListener('click', () => { input.value = b.textContent; update(); input.focus(); }));

  // Grawlix keep bubbling: re-roll on their own every few seconds while you watch.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(() => { if (parts.some((p) => p.profane) && document.activeElement?.className !== 'g') reroll(); }, 1800);
  }

  input.value = 'STUBBED MY TOE ON THE BLOODY BED FRAME, FUCK!';
  update();
</script>
