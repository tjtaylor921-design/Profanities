<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grawlix Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff6d6;
    --dots: #f3c94a;
    --ink: #161616;
    --bubble: #ffffff;
    --pow: #e8352b;
    --zap: #1f6fd1;
    --muted: #5b5444;
    --meter-bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b1830; --dots: #2d2850; --ink: #f4efe1; --bubble: #262243;
      --pow: #ff5a4e; --zap: #5aa2ff; --muted: #b9b2d6; --meter-bg: #14122a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1b1830; --dots: #2d2850; --ink: #f4efe1; --bubble: #262243;
    --pow: #ff5a4e; --zap: #5aa2ff; --muted: #b9b2d6; --meter-bg: #14122a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(var(--dots) 22%, transparent 24%);
    background-size: 14px 14px;
    font-family: "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }

  h1 {
    font-family: Bangers, Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(48px, 12vw, 92px);
    letter-spacing: 2px;
    line-height: .95;
    margin: 0 0 8px;
    color: var(--pow);
    -webkit-text-stroke: 2px var(--ink);
    text-shadow: 5px 5px 0 var(--ink);
    transform: rotate(-2deg);
  }
  .tag { margin: 0 0 28px; font-size: 18px; color: var(--muted); font-weight: 700; }

  .panel {
    background: var(--bubble);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    padding: 18px;
    margin-bottom: 36px;
  }
  label { display: block; font-family: Bangers, Impact, sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    font: 700 18px/1.4 "Comic Neue", system-ui, sans-serif;
    color: var(--ink);
    background: transparent;
    border: 3px dashed var(--muted);
    padding: 10px 12px;
    outline: none;
  }
  textarea:focus { border-color: var(--zap); border-style: solid; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  button {
    font-family: Bangers, Impact, sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--dots);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 6px 14px;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  button:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button.primary { background: var(--pow); color: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; margin-left: auto; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--pow); }

  /* Speech bubble */
  .stage { position: relative; padding-bottom: 8px; }
  .bubble {
    position: relative;
    background: var(--bubble);
    border: 4px solid var(--ink);
    border-radius: 48% 52% 46% 54% / 58% 50% 50% 42%;
    padding: 46px 40px;
    min-height: 170px;
    display: grid;
    place-items: center;
    text-align: center;
    font: 700 clamp(22px, 5vw, 32px)/1.35 "Comic Neue", system-ui, sans-serif;
    box-shadow: 8px 8px 0 var(--ink);
    overflow-wrap: anywhere;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -46px; left: 28%;
    width: 46px; height: 50px;
    background: var(--bubble);
    border-right: 4px solid var(--ink);
    border-bottom: 4px solid var(--ink);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    transform: skewX(-25deg);
  }
  .bubble.empty { color: var(--muted); font-style: italic; font-weight: 400; }
  .bubble.fury { animation: quake .25s infinite; }

  .g {
    display: inline-block;
    color: var(--pow);
    font-family: Bangers, Impact, sans-serif;
    letter-spacing: 1px;
    cursor: help;
    position: relative;
  }
  .g span { display: inline-block; animation: jitter .6s infinite; }
  .g span:nth-child(3n)   { color: var(--zap); animation-delay: -.2s; }
  .g span:nth-child(3n+1) { animation-delay: -.4s; }
  .g[data-word]:hover::after, .g[data-word]:focus::after {
    content: attr(data-word);
    position: absolute;
    left: 50%; bottom: 110%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font: 700 14px "Comic Neue", sans-serif;
    padding: 3px 8px;
    white-space: nowrap;
    z-index: 2;
  }
  .g:focus { outline: 2px dotted var(--zap); outline-offset: 2px; }

  @keyframes jitter {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(-1px, -2px) rotate(-6deg); }
    50% { transform: translate(1px, 1px) rotate(4deg); }
    75% { transform: translate(-1px, 2px) rotate(-3deg); }
  }
  @keyframes quake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(-3px, 2px) rotate(-.6deg); }
    50% { transform: translate(3px, -2px) rotate(.6deg); }
    75% { transform: translate(-2px, -3px) rotate(-.3deg); }
  }


  /* The speaker: a 1950s pinup in a polka-dot dress whose face follows the rage meter */
  .speaker {
    display: block;
    width: min(300px, 74vw);
    height: auto;
    margin: 4px 0 0 max(0px, calc(28% - 150px));
    overflow: visible;
  }
  .speaker .ln { stroke: #8a4a32; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .speaker .limb, .speaker .limb-o { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .speaker .limb { stroke: #f4bf9b; stroke-width: 24; }
  .speaker .limb-o { stroke: #8a4a32; stroke-width: 28; }
  .speaker .limb.leg { stroke-width: 32; }
  .speaker .limb-o.leg { stroke-width: 36; }
  .speaker .arm-up { transform-origin: 202px 176px; animation: wave 2.4s ease-in-out infinite; }
  .speaker[data-mood="angry"] .arm-up, .speaker[data-mood="nuclear"] .arm-up { animation: shake .22s linear infinite; }
  @keyframes wave { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(8deg); } }
  @keyframes shake { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .speaker .brow { fill: none; stroke: #8a3013; stroke-width: 3.5; stroke-linecap: round; transition: transform .25s; }
  .speaker .brow-l { transform-origin: 121px 78px; }
  .speaker .brow-r { transform-origin: 179px 78px; }
  .speaker .flush { fill: #e8352b; opacity: 0; transition: opacity .3s; }
  .speaker .mouth, .speaker .steam, .speaker .vein { display: none; }
  .speaker[data-mood="calm"] .m-smile,
  .speaker[data-mood="miffed"] .m-purse,
  .speaker[data-mood="angry"] .m-shout,
  .speaker[data-mood="nuclear"] .m-shout { display: inline; }
  .speaker[data-mood="miffed"] .brow-l { transform: rotate(8deg); }
  .speaker[data-mood="miffed"] .brow-r { transform: rotate(-8deg); }
  .speaker[data-mood="miffed"] .flush { opacity: .08; }
  .speaker[data-mood="angry"] .brow-l, .speaker[data-mood="nuclear"] .brow-l { transform: rotate(20deg); }
  .speaker[data-mood="angry"] .brow-r, .speaker[data-mood="nuclear"] .brow-r { transform: rotate(-20deg); }
  .speaker[data-mood="angry"] .flush { opacity: .22; }
  .speaker[data-mood="angry"] .vein, .speaker[data-mood="nuclear"] .vein { display: inline; }
  .speaker[data-mood="nuclear"] .flush { opacity: .4; }
  .speaker[data-mood="nuclear"] .steam { display: inline; animation: puff 1s ease-out infinite; }
  .speaker[data-mood="nuclear"] .steam-r { animation-delay: -.5s; }
  .speaker[data-mood="nuclear"] .head { animation: quake .3s infinite; transform-origin: 150px 150px; }
  @keyframes puff {
    0% { transform: translateY(8px) scale(.6); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(-22px) scale(1.15); opacity: 0; }
  }
  .speaker .steam { transform-box: fill-box; transform-origin: center; }

  /* Rage meter */
  .meter { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .meter-label { font-family: Bangers, Impact, sans-serif; font-size: 22px; letter-spacing: 1px; min-width: 120px; }
  .bar { flex: 1; height: 26px; border: 3px solid var(--ink); background: var(--meter-bg); position: relative; overflow: hidden; }
  .fill {
    height: 100%;
    width: 0;
    background: repeating-linear-gradient(-45deg, var(--pow) 0 12px, #ff8a3d 12px 24px);
    transition: width .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .verdict { font-family: Bangers, Impact, sans-serif; font-size: 22px; min-width: 132px; text-align: right; color: var(--pow); }

  /* Pow burst */
  .burst {
    position: absolute;
    right: 4px; top: -26px;
    font-family: Bangers, Impact, sans-serif;
    font-size: 34px;
    color: #fff;
    background: var(--pow);
    padding: 26px 22px;
    clip-path: polygon(50% 0, 61% 30%, 98% 18%, 72% 46%, 100% 70%, 64% 68%, 56% 100%, 44% 70%, 6% 88%, 30% 58%, 0 30%, 38% 32%);
    transform: rotate(12deg) scale(0);
    transition: transform .25s cubic-bezier(.3, 1.8, .5, 1);
    pointer-events: none;
    -webkit-text-stroke: 1px var(--ink);
  }
  .burst.show { transform: rotate(12deg) scale(1); }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .presets button { font-size: 16px; padding: 4px 10px; box-shadow: 3px 3px 0 var(--ink); background: var(--bubble); }

  footer { margin-top: 40px; color: var(--muted); font-size: 15px; }
  code { font-family: ui-monospace, monospace; background: var(--bubble); border: 2px solid var(--ink); padding: 0 5px; }

  @media (max-width: 520px) {
    .toggle { margin-left: 0; }
    .meter { flex-wrap: wrap; }
    .meter-label, .verdict { min-width: 0; }
    .bubble { padding: 36px 22px; }
    .burst { font-size: 24px; padding: 18px 16px; right: 0; }
    .speaker { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .g span, .bubble.fury, .speaker .steam, .speaker .head, .speaker .arm-up { animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Grawlix Machine</h1>
  <p class="tag">Type something rude and get it back as cartoon swearing. Hover a symbol to see the word underneath.</p>

  <section class="panel">
    <label for="input">Say it. Go on.</label>
    <textarea id="input" spellcheck="false" placeholder="e.g. the damn printer jammed again"></textarea>
    <div class="controls">
      <button class="primary" id="reroll" type="button">Re-roll!</button>
      <button id="copy" type="button">Copy</button>
      <label class="toggle"><input type="checkbox" id="everything"> Censor everything</label>
    </div>
    <div class="presets" aria-label="Example rants">
      <button type="button">The damn wifi is down AGAIN!!</button>
      <button type="button">who left this shit in the fridge</button>
      <button type="button">STUBBED MY TOE ON THE BLOODY BED FRAME, FUCK!</button>
      <button type="button">Have a lovely day :)</button>
    </div>
  </section>

  <section class="stage" aria-live="polite">
    <div class="burst" id="burst">POW!</div>
    <div class="bubble empty" id="bubble">…</div>
    <svg class="speaker" id="speaker" data-mood="calm" viewBox="0 0 300 440" role="img" aria-label="A curvy 1950s pinup woman with curly red hair and a teal sundress, saying the words in the bubble">
      <defs>
        <radialGradient id="skin" cx=".38" cy=".32" r=".8">
          <stop offset="0" stop-color="#fde4cf"/><stop offset=".55" stop-color="#f6c19d"/><stop offset="1" stop-color="#e3977a"/>
        </radialGradient>
        <radialGradient id="hair" cx=".35" cy=".3" r=".8">
          <stop offset="0" stop-color="#f39457"/><stop offset=".55" stop-color="#c9531f"/><stop offset="1" stop-color="#8a3013"/>
        </radialGradient>
        <radialGradient id="dress" cx=".4" cy=".25" r=".9">
          <stop offset="0" stop-color="#6fd3c4"/><stop offset=".55" stop-color="#2a9d8f"/><stop offset="1" stop-color="#196a60"/>
        </radialGradient>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
          <circle cx="5" cy="5" r="2.6" fill="#fffaf0" opacity=".55"/><circle cx="14" cy="14" r="2.6" fill="#fffaf0" opacity=".55"/>
        </pattern>
        <clipPath id="face"><ellipse cx="150" cy="96" rx="46" ry="48"/></clipPath>
      </defs>

      <!-- legs and shoes -->
      <path class="limb-o leg" d="M124 368 L119 416 M176 368 L181 416"/>
      <path class="limb leg" d="M124 368 L119 416 M176 368 L181 416"/>
      <ellipse class="ln" fill="#d8322a" cx="114" cy="428" rx="22" ry="9"/>
      <ellipse class="ln" fill="#d8322a" cx="186" cy="428" rx="22" ry="9"/>

      <!-- neck, shoulders, dress -->
      <path class="ln" fill="url(#skin)" d="M135 126 L135 158 L165 158 L165 126 Z"/>
      <path class="ln" fill="url(#skin)" d="M94 176 C98 156 122 146 150 146 C178 146 202 156 206 176 L202 206 L98 206 Z"/>
      <path fill="none" stroke="#c97c5d" stroke-width="1.8" stroke-linecap="round" opacity=".7" d="M140 170 Q150 176 160 170"/>
      <path class="ln" fill="url(#skin)" d="M90 256 C64 302 52 342 44 368 Q150 394 256 368 C248 342 236 302 210 256 Z"/>
      <path class="ln" fill="url(#dress)" d="M90 256 C64 302 52 342 44 368 Q150 394 256 368 C248 342 236 302 210 256 Z"/>
      <path fill="url(#dots)" d="M90 256 C64 302 52 342 44 368 Q150 394 256 368 C248 342 236 302 210 256 Z"/>
      <path fill="none" stroke="#165c53" stroke-width="2" opacity=".45" stroke-linecap="round" d="M120 264 Q108 322 100 380 M150 264 L150 386 M180 264 Q192 322 200 380"/>
      <path fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" d="M46 366 Q150 392 254 366"/>
      <path class="ln" fill="url(#dress)" d="M102 178 Q126 196 150 184 Q174 196 198 178 C214 198 218 228 212 254 L88 254 C82 228 86 198 102 178 Z"/>
      <path fill="url(#dots)" d="M102 178 Q126 196 150 184 Q174 196 198 178 C214 198 218 228 212 254 L88 254 C82 228 86 198 102 178 Z"/>
      <path fill="none" stroke="#2a9d8f" stroke-width="7" stroke-linecap="round" d="M108 182 L114 158 M192 182 L186 158"/>
      <rect class="ln" fill="#d8322a" x="86" y="246" width="128" height="13" rx="6.5"/>
      <rect fill="none" stroke="#ffd27a" stroke-width="2.5" x="143" y="247.5" width="14" height="10" rx="2"/>

      <!-- arm on hip -->
      <path class="limb-o" d="M98 176 Q66 206 70 228 Q76 248 102 250"/>
      <path class="limb" d="M98 176 Q66 206 70 228 Q76 248 102 250"/>

      <!-- raised arm: waves when calm, shakes a fist when angry -->
      <g class="arm-up">
        <path class="limb-o" d="M202 176 Q236 166 240 150 Q244 130 234 112"/>
        <path class="limb" d="M202 176 Q236 166 240 150 Q244 130 234 112"/>
        <circle class="ln" fill="url(#skin)" cx="232" cy="102" r="15"/>
        <path fill="none" stroke="#c97c5d" stroke-width="1.8" stroke-linecap="round" d="M224 96 Q232 92 240 96 M223 103 Q232 99 241 103"/>
      </g>

      <g class="head">
        <!-- curls behind the face -->
        <g fill="url(#hair)" class="ln">
          <circle cx="108" cy="72" r="22"/><circle cx="194" cy="72" r="22"/>
          <circle cx="102" cy="98" r="19"/><circle cx="198" cy="98" r="19"/>
          <circle cx="106" cy="122" r="15"/><circle cx="194" cy="122" r="15"/>
          <circle cx="126" cy="52" r="24"/><circle cx="174" cy="52" r="24"/><circle cx="150" cy="44" r="26"/>
        </g>
        <!-- face -->
        <ellipse class="ln" fill="url(#skin)" cx="150" cy="96" rx="46" ry="48"/>
        <ellipse class="flush" cx="150" cy="96" rx="46" ry="48" clip-path="url(#face)"/>
        <path fill="none" stroke="#c97c5d" stroke-width="1.8" stroke-linecap="round" opacity=".6" d="M134 141 Q150 150 166 141"/>
        <ellipse fill="#f07a7a" opacity=".5" cx="122" cy="112" rx="12" ry="9"/>
        <ellipse fill="#f07a7a" opacity=".5" cx="178" cy="112" rx="12" ry="9"/>
        <!-- bangs and bow -->
        <g fill="url(#hair)" class="ln">
          <circle cx="126" cy="62" r="16"/><circle cx="150" cy="56" r="17"/><circle cx="174" cy="62" r="16"/>
        </g>
        <path class="ln" fill="#2a9d8f" d="M186 44 L170 30 Q164 42 172 54 Z M186 44 L202 30 Q208 42 200 54 Z"/>
        <circle class="ln" fill="#2a9d8f" cx="186" cy="44" r="5.5"/>
        <!-- anger vein -->
        <path class="vein" fill="none" stroke="#e8352b" stroke-width="3.5" stroke-linecap="round" d="M114 40 q4 4 0 8 M122 40 q-4 4 0 8 M112 50 q4 -4 8 0 M112 38 q4 4 8 0"/>
        <!-- eyes -->
        <ellipse class="ln" fill="#fff" cx="132" cy="96" rx="9" ry="10.5"/>
        <ellipse class="ln" fill="#fff" cx="168" cy="96" rx="9" ry="10.5"/>
        <circle fill="#3f8a55" cx="133" cy="97" r="6.5"/><circle fill="#1a1a1a" cx="133" cy="97" r="3.4"/><circle fill="#fff" cx="135.5" cy="94.5" r="1.8"/>
        <circle fill="#3f8a55" cx="167" cy="97" r="6.5"/><circle fill="#1a1a1a" cx="167" cy="97" r="3.4"/><circle fill="#fff" cx="169.5" cy="94.5" r="1.8"/>
        <path fill="none" stroke="#3a1d12" stroke-width="3" stroke-linecap="round" d="M122 93 Q132 82 142 92 M122 93 L117 89 M124 89 L120 84 M158 92 Q168 82 178 93 M178 93 L183 89 M176 89 L180 84"/>
        <path class="brow brow-l" d="M121 78 Q132 70 143 76"/>
        <path class="brow brow-r" d="M157 76 Q168 70 179 78"/>
        <!-- button nose -->
        <path fill="none" stroke="#c97c5d" stroke-width="2.2" stroke-linecap="round" d="M145 108 Q150 114 156 109"/>
        <circle fill="#fff" opacity=".6" cx="151" cy="105" r="2"/>
        <!-- mouths, one per mood -->
        <g class="mouth m-smile">
          <path fill="#8a1f2a" stroke="#d23b4a" stroke-width="3" stroke-linejoin="round" d="M133 120 Q150 142 167 120 Q150 126 133 120 Z"/>
          <path fill="#fff" d="M137 122 Q150 127 163 122 L161 126 Q150 130 139 126 Z"/>
        </g>
        <path class="mouth m-purse" fill="#d23b4a" stroke="#a52434" stroke-width="1.5" d="M140 126 Q145 120 150 123 Q155 120 160 126 Q150 131 140 126 Z"/>
        <g class="mouth m-shout">
          <ellipse fill="#6b1420" stroke="#d23b4a" stroke-width="4" cx="150" cy="128" rx="12" ry="13"/>
          <rect fill="#fff" x="142" y="117.5" width="16" height="4" rx="1.5"/>
        </g>
      </g>

      <!-- steam -->
      <g class="steam steam-l"><circle class="ln" fill="#fff" cx="72" cy="58" r="9"/><circle class="ln" fill="#fff" cx="62" cy="44" r="11"/><circle class="ln" fill="#fff" cx="74" cy="32" r="8"/></g>
      <g class="steam steam-r"><circle class="ln" fill="#fff" cx="222" cy="40" r="8"/><circle class="ln" fill="#fff" cx="234" cy="28" r="10"/><circle class="ln" fill="#fff" cx="224" cy="16" r="7"/></g>
    </svg>
  </section>

  <div class="meter">
    <span class="meter-label">Rage meter</span>
    <div class="bar" role="meter" aria-label="Rage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div>
    <span class="verdict" id="verdict">Zen</span>
  </div>

  <footer>
    Underneath it all is <code>grawlix.js</code>, a profanity filter with no dependencies.
    It runs in the browser and in Node: <code>censor("oh shit")</code> → <code>"oh @#☠%"</code>.
  </footer>
</main>

<script type="module">
  import { tokenize, grawlix, rage } from './grawlix.js';

  const $ = (id) => document.getElementById(id);
  const input = $('input'), bubble = $('bubble'), everything = $('everything');
  const speaker = $('speaker'), fill = $('fill'), bar = $('bar'), verdict = $('verdict'), burst = $('burst');

  const VERDICTS = [
    [0, 'Zen'], [1, 'Mildly miffed'], [25, 'Grumpy'], [45, 'Steaming'],
    [65, 'Livid'], [85, 'NUCLEAR'],
  ];

  let parts = [];

  function render() {
    bubble.replaceChildren();
    bubble.className = 'bubble';
    const text = input.value.trim();
    if (!text) {
      bubble.className = 'bubble empty';
      bubble.textContent = '…';
    } else {
      const line = document.createElement('p');
      line.style.margin = '0';
      bubble.append(line);
      for (const p of parts) {
        if (!p.profane) { line.append(p.text); continue; }
        const g = document.createElement('span');
        g.className = 'g';
        g.tabIndex = 0;
        g.dataset.word = p.text;
        g.setAttribute('aria-label', 'censored');
        for (const ch of p.replacement) {
          const s = document.createElement('span');
          s.textContent = ch;
          g.append(s);
        }
        line.append(g);
      }
    }
    const score = everything.checked && text ? 100 : rage(text);
    fill.style.width = score + '%';
    bar.setAttribute('aria-valuenow', score);
    verdict.textContent = VERDICTS.filter(([min]) => score >= min).pop()[1];
    bubble.classList.toggle('fury', score >= 85);
    speaker.dataset.mood = score >= 85 ? 'nuclear' : score >= 45 ? 'angry' : score >= 15 ? 'miffed' : 'calm';
    burst.classList.toggle('show', parts.some((p) => p.profane));
  }

  function update() {
    parts = tokenize(input.value.trim(), { everything: everything.checked });
    render();
  }

  // Swap fresh symbols in place, keeping the same words.
  function reroll() {
    parts = parts.map((p) => p.profane ? { ...p, replacement: grawlix(p.text.length) } : p);
    render();
  }

  input.addEventListener('input', update);
  everything.addEventListener('change', update);
  $('reroll').addEventListener('click', reroll);
  $('copy').addEventListener('click', async (e) => {
    const out = parts.map((p) => p.replacement ?? p.text).join('');
    try { await navigator.clipboard.writeText(out); e.target.textContent = 'Copied!'; }
    catch { e.target.textContent = 'Nope'; }
    setTimeout(() => (e.target.textContent = 'Copy'), 1200);
  });
  document.querySelectorAll('.presets button').forEach((b) =>
    b.addEventListener('click', () => { input.value = b.textContent; update(); input.focus(); }));

  // Grawlix keep bubbling: re-roll on their own every few seconds while you watch.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(() => { if (parts.some((p) => p.profane) && document.activeElement?.className !== 'g') reroll(); }, 1800);
  }

  input.value = 'STUBBED MY TOE ON THE BLOODY BED FRAME, FUCK!';
  update();
</script>
</body>
</html>
